
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiprocket Checkout</title>
</head>
<body>
    <h1>Checkout Page</h1>

    <form id="checkout-form">
        <label for="order_id">Order ID:</label>
        <input type="text" id="order_id" name="order_id" required><br><br>

        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" required><br><br>

        <button type="submit" id="checkout-button">Checkout</button>
    </form>

    <div id="response-container" style="margin-top: 20px;"></div>

    <script>
        const form = document.getElementById("checkout-form");
        const responseContainer = document.getElementById("response-container");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const orderId = document.getElementById("order_id").value;
            const amount = document.getElementById("amount").value;

            try {
                const response = await fetch("/api/checkout", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ order_id: orderId, amount: amount }),
                });

                const data = await response.json();

                if (response.ok) {
                    responseContainer.innerHTML = `
                        <p style="color: green;">${JSON.stringify(data)}</p>
                    `;
                } else {
                    responseContainer.innerHTML = `
                        <p style="color: red;">Error: ${data.message}</p>
                    `;
                }
            } catch (error) {
                responseContainer.innerHTML = `
                    <p style="color: red;">Network Error: ${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
