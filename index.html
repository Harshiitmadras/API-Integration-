<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiprocket Checkout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .output {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shiprocket Checkout</h1>
        <button id="checkoutBtn">Checkout</button>
        <div class="output" id="output"></div>
    </div>

    <script>
        const checkoutBtn = document.getElementById("checkoutBtn");
        const outputDiv = document.getElementById("output");

        checkoutBtn.addEventListener("click", async () => {
            outputDiv.textContent = "Processing checkout...";
            try {
                const response = await fetch("https://shiprocket-checkout.vercel.app/api/checkout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        order_id: "123456", // Replace with dynamic data if needed
                        amount: 500
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    outputDiv.textContent = Checkout Successful! Order ID: ${data.order_id}, Amount: ${data.amount};
                } else {
                    outputDiv.textContent = Error: ${data.message};
                }
            } catch (error) {
                outputDiv.textContent = Failed to connect: ${error.message};
            }
        });
    </script>
</body>
</html>
