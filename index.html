
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiprocket Checkout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shiprocket Checkout</h1>
        <label for="orderId">Order ID</label>
        <input type="text" id="orderId" placeholder="Enter Order ID" />
        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="Enter Amount" />
        <button id="checkoutBtn">Checkout</button>
        <div class="output" id="output"></div>
    </div>

    <script>
        const checkoutBtn = document.getElementById("checkoutBtn");
        const outputDiv = document.getElementById("output");

        checkoutBtn.addEventListener("click", async () => {
            const orderId = document.getElementById("orderId").value;
            const amount = document.getElementById("amount").value;

            if (!orderId || !amount) {
                outputDiv.innerHTML = "<span class='error'>Please enter both Order ID and Amount.</span>";
                return;
            }

            outputDiv.textContent = "Processing checkout...";

            try {
                const response = await fetch("/api/checkout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ order_id: orderId, amount: amount })
                });

                const data = await response.json();

                if (response.ok) {
                    outputDiv.innerHTML = `
                        <div>
                            <strong>Checkout Successful!</strong><br />
                            <strong>Order ID:</strong> ${data.order_id}<br />
                            <strong>Amount:</strong> ${data.amount}<br />
                            <strong>Message:</strong> ${data.message}
                        </div>
                    `;
                } else {
                    outputDiv.innerHTML = <span class='error'>Error: ${data.message}</span>;
                }
            } catch (error) {
                outputDiv.innerHTML = <span class='error'>Failed to connect: ${error.message}</span>;
            }
        });
    </script>
</body>
</html>
